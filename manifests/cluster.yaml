apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: aws-eks-mysql-platform-development
  region: us-east-1
  version: "1.36"

accessConfig:
  authenticationMode: API
  bootstrapClusterCreatorAdminPermissions: true

vpc:
  id: "vpc-058b75e5901a1f283"
  subnets:
    public:
      us-east-1a:
        id: "subnet-005a6016f63b90ea5"
      us-east-1b:
        id: "subnet-022d80a8268caff73"

managedNodeGroups:
  - name: ng-1
    amiFamily: AmazonLinux2023
    instanceType: t3.large
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
