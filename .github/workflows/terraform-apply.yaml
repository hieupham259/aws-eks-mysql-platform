name: Terraform Apply

on:
  push:
    branches: [development, production]
    paths:
      - 'envs/**'
      - 'modules/**'
      - '.github/workflows/terraform-apply.yaml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify envs/development and envs/production are in sync
        run: bash scripts/verify-envs-in-sync.sh

  apply:
    needs: sync-check
    runs-on: ubuntu-latest
    # The branch name is the environment name. It selects the GitHub
    # Environment, the envs/<branch> directory and the <branch>_account_id
    # repository variable.
    environment: ${{ github.ref_name }}
    env:
      ENV_DIR: ${{ github.ref_name }}
      ACCOUNT_ID: ${{ vars[format('{0}_account_id', github.ref_name)] }}
    defaults:
      run:
        working-directory: envs/${{ env.ENV_DIR }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the account variable
        run: |
          if [ -z "${ACCOUNT_ID}" ]; then
            echo "::error::Repository variable ${GITHUB_REF_NAME}_account_id is not set."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/aws-eks-mysql-platform-gha-apply
          aws-region: us-east-1

      - name: Terraform init
        # backend.tf leaves the bucket out: its name ends with the account ID.
        run: terraform init -no-color -backend-config="bucket=aws-eks-mysql-platform-tfstate-${ACCOUNT_ID}"

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan -input=false

      - name: Terraform apply
        run: terraform apply -no-color -input=false tfplan
