name: Terraform Plan

# Required GitHub Actions Repository Variables (Settings -> Secrets and variables -> Actions -> Variables tab):
#   <environment>_ACCOUNT_ID - 12-digit AWS account ID of that environment, one variable per
#                              environment: DEVELOPMENT_ACCOUNT_ID, PRODUCTION_ACCOUNT_ID
# These are stored as Variables (not Secrets) because account IDs are configuration, not credentials.
# All workflows in this directory look the variable up by environment name; GitHub stores the
# names in upper case and ignores case on lookup. Set them once at the repository level.

on:
  pull_request:
    branches: [development, production]
    paths:
      - 'envs/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/terraform-plan.yaml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify envs/development and envs/production are in sync
        run: bash scripts/verify-envs-in-sync.sh

  plan:
    needs: sync-check
    runs-on: ubuntu-latest
    # The target branch of the pull request is the environment name. It selects
    # the envs/<branch> directory and the <branch>_account_id repository variable.
    env:
      ENV_DIR: ${{ github.base_ref }}
      ACCOUNT_ID: ${{ vars[format('{0}_account_id', github.base_ref)] }}
    defaults:
      run:
        working-directory: envs/${{ env.ENV_DIR }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the account variable
        run: |
          if [ -z "${ACCOUNT_ID}" ]; then
            echo "::error::Repository variable ${ENV_DIR}_account_id is not set."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/aws-eks-mysql-platform-gha-plan
          aws-region: us-east-1

      - name: Terraform fmt -check
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init
        # backend.tf leaves the bucket out: its name ends with the account ID.
        run: terraform init -no-color -backend-config="bucket=aws-eks-mysql-platform-tfstate-${ACCOUNT_ID}"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan -input=false
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v9
        with:
          script: |
            const output = `### Terraform Plan - \`${{ env.ENV_DIR }}\` ${{ steps.plan.outcome == 'success' && 'OK' || 'FAILED' }}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail step if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
