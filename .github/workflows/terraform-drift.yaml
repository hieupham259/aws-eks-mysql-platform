name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 18 * * *'   # 01:00 ICT every day
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        # One job per environment. The name selects the branch to check out,
        # the envs/<name> directory and the <name>_account_id repository variable.
        env: [development, production]
    runs-on: ubuntu-latest
    env:
      ACCOUNT_ID: ${{ vars[format('{0}_account_id', matrix.env)] }}
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.env }}

      - name: Check the account variable
        run: |
          if [ -z "${ACCOUNT_ID}" ]; then
            echo "::error::Repository variable ${{ matrix.env }}_account_id is not set."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/aws-eks-mysql-platform-gha-plan
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform plan (detect drift)
        run: terraform plan -detailed-exitcode -no-color
        # exit code 0 = no diff, 2 = diff (drift). Fail the step if = 2 -> notify.
