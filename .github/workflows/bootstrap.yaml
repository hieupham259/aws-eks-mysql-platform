name: Bootstrap (CFN - state backend + OIDC roles)

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Target AWS account'
        type: choice
        required: true
        options: [development, production]

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: bootstrap        # requires manual approval from one reviewer
    env:
      AWS_REGION: us-east-1
      # The selected name picks the <name>_account_id repository variable.
      ACCOUNT_ID: ${{ vars[format('{0}_account_id', inputs.account)] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the account variable
        run: |
          if [ -z "${ACCOUNT_ID}" ]; then
            echo "::error::Repository variable ${{ inputs.account }}_account_id is not set."
            exit 1
          fi

      - name: Verify variables
        run: |
          echo "AWS_REGION: $AWS_REGION"
          echo "ACCOUNT_ID: $ACCOUNT_ID"
          echo "OIDC_SUBJECT_PREFIX: ${{ vars.OIDC_SUBJECT_PREFIX }}"
          echo "DEPLOY_ENVIRONMENTS: ${{ vars.DEPLOY_ENVIRONMENTS }}"

      - name: Configure AWS credentials (assume gha-bootstrap)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/aws-eks-mysql-platform-gha-bootstrap
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller identity
        run: aws sts get-caller-identity

      - name: Deploy stack 02-tfstate-backend
        run: |
          aws cloudformation deploy \
            --stack-name aws-eks-mysql-platform-tfstate-backend \
            --template-file bootstrap/02-tfstate-backend.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Read outputs from tfstate-backend
        id: tfstate
        run: |
          BUCKET_ARN=$(aws cloudformation describe-stacks --stack-name aws-eks-mysql-platform-tfstate-backend \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketArn`].OutputValue' --output text)
          KMS_ARN=$(aws cloudformation describe-stacks --stack-name aws-eks-mysql-platform-tfstate-backend \
            --query 'Stacks[0].Outputs[?OutputKey==`KmsKeyArn`].OutputValue' --output text)
          echo "bucket_arn=$BUCKET_ARN" >> $GITHUB_OUTPUT
          echo "kms_arn=$KMS_ARN" >> $GITHUB_OUTPUT

      - name: Deploy stack 03-github-oidc-roles
        run: |
          aws cloudformation deploy \
            --stack-name aws-eks-mysql-platform-github-oidc-roles \
            --template-file bootstrap/03-github-oidc-roles.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              OidcSubjectPrefix=${{ vars.OIDC_SUBJECT_PREFIX }} \
              "ApplyEnvironments=${{ vars.DEPLOY_ENVIRONMENTS }}" \
              TfstateBucketArn=${{ steps.tfstate.outputs.bucket_arn }} \
              TfstateKmsKeyArn=${{ steps.tfstate.outputs.kms_arn }}

      - name: Print role ARNs
        run: |
          aws cloudformation describe-stacks --stack-name aws-eks-mysql-platform-github-oidc-roles \
            --query 'Stacks[0].Outputs' --output table
